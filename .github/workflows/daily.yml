name: Daily journal

on:
  schedule:
    # GitHub delays :00 jobs on small repos by hours. Offset minutes, plus a backup.
    # First fire is 6:23 AM Central during CDT (11:23 UTC). Backup is 8:07 AM CDT.
    # write.mjs no-ops if today's post already exists, so a double fire is safe.
    - cron: "23 11 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-journal
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write today's entry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run write

      - name: Ensure each entry has a photograph
        run: python3 scripts/og.py

      - name: Commit and push (this deploys the blog on Vercel)
        run: |
          git config user.name "sovereign-journal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts state.json public/og
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "posted=false" >> "$GITHUB_ENV"
          else
            git commit -m "journal: $(date -u +%F)"
            git push
            echo "posted=true" >> "$GITHUB_ENV"
          fi

      - name: Wait for Vercel to deploy the new post
        if: env.posted == 'true'
        run: sleep 120

      - name: Post to LinkedIn
        if: env.posted == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: npm run post:linkedin

      - name: Email subscribers
        if: env.posted == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run post:email

      - name: Keep today's LinkedIn text as an artifact
        if: ${{ always() && env.posted == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-${{ github.run_id }}
          path: out/
